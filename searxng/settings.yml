use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "newsagent-internal-search-change-me"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
