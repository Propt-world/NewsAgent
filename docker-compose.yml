  #     - REDIS_URL=redis://redis:6379
  #     - NEWSAGENT_API_KEY=${NEWSAGENT_API_KEY}
  #     - SMTP_SERVER=${SMTP_SERVER}
  #     - SMTP_PORT=${SMTP_PORT}
  #     - SMTP_EMAIL=${SMTP_EMAIL}
  #     - SMTP_PASSWORD=${SMTP_PASSWORD}
  #   env_file:
