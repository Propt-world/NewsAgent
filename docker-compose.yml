  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # --- 1. The Message Broker (Redis) ---
  redis:
    image: redis:alpine
    container_name: newsagent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 4. The Browser Fleet ---
  # browserless:
  #   image: ghcr.io/browserless/chromium:latest
  #   container_name: newsagent_browserless
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - TIMEOUT=60000
  #     - MAX_CONCURRENT_SESSIONS=10
  #     - TOKEN=${BROWSERLESS_TOKEN}
  #   shm_size: '2gb'
  #   restart: always
  #   healthcheck:
  #     test: [ "CMD-SHELL", "curl -f http://localhost:3000/pressure?token=${BROWSERLESS_TOKEN} || exit 1" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # --- 5. The API (Producer) ---
  api:
    build: .
    container_name: newsagent_api
    command: uvicorn src.main:api --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SCHEDULER_URL=http://scheduler:8001
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NEWSAGENT_API_KEY=${NEWSAGENT_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # --- 6. The Worker (Consumer) ---
  # worker:
