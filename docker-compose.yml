services:
  # --- 1. The Message Broker (Redis) ---
  redis:
    image: redis:alpine
    container_name: newsagent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 4. The Browser Fleet ---
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: newsagent_browserless
    ports:
      - "3000:3000"
    environment:
      - TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - TOKEN=${BROWSERLESS_TOKEN}
    shm_size: '2gb'
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/pressure?token=${BROWSERLESS_TOKEN} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 5. Search Context Service ---
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: newsagent_searxng
    ports:
      # Exposed for local debugging; other services use http://searxng:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8080/}
    restart: always

  # --- 6. The API (Producer) ---
  api:
    image: newsagent-api
    build: .
    container_name: newsagent_api
    # Internal callers use the Docker service name: http://api:8003
    command: uvicorn src.main:api --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    environment:
      # Network: Service names are hostnames
      - REDIS_URL=redis://redis:6379
      # Use the container name 'mongo' for the connection
      # Use the configured URL from .env (Atlas)
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Pass through keys from your local machine
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_BASE_URL=${SEARXNG_INTERNAL_URL:-http://searxng:8080}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-duckduckgo,brave}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - SEARCH_TIMEOUT_SECONDS=${SEARCH_TIMEOUT_SECONDS:-8}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-86400}
      - MAIN_API_URL=http://api:8003
      - SCHEDULER_URL=http://scheduler:8001
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NEWSAGENT_API_KEY=${NEWSAGENT_API_KEY}
      # Email Settings
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started

  # --- 7. The Worker (Consumer) ---
  worker:
    build: .
    container_name: newsagent_worker
    command: python src/worker.py
    volumes:
      - .:/app
    environment:
      - BROWSER_WS_ENDPOINT=ws://browserless:3000?token=${BROWSERLESS_TOKEN}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_BASE_URL=${SEARXNG_INTERNAL_URL:-http://searxng:8080}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-duckduckgo,brave}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - SEARCH_TIMEOUT_SECONDS=${SEARCH_TIMEOUT_SECONDS:-8}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-86400}
      - MAIN_API_URL=http://api:8003
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NEWSAGENT_API_KEY=${NEWSAGENT_API_KEY}
      # Email Settings
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    env_file:
      - .env
    shm_size: '2gb' # Shared memory size for the worker
    depends_on:
      redis:
        condition: service_healthy

      browserless:
        condition: service_healthy
      searxng:
        condition: service_started

  # --- 8. The Scheduler Service ---
  scheduler:
    build: .
    container_name: newsagent_scheduler
    # Runs the new scheduler/main.py
    command: uvicorn src.scheduler.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      # Connects to the same DB to store sources/archives
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Needs to know where the main API is to submit jobs
      - MAIN_API_URL=http://api:8003
      # Source ID for manually submitted articles (can be overridden via .env)
      - SUBMISSION_SOURCE_ID=${SUBMISSION_SOURCE_ID:-newsagent_scheduled_source}
      - BROWSER_WS_ENDPOINT=ws://browserless:3000?token=${BROWSERLESS_TOKEN}
      - REDIS_URL=redis://redis:6379
      - NEWSAGENT_API_KEY=${NEWSAGENT_API_KEY}

      # Email Settings for Failure Notifications
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    env_file:
      - .env
    shm_size: '2gb' # Shared memory size for the scheduler
    depends_on:

      api:
        # Scheduler needs API to be up to submit jobs
        condition: service_started
      browserless:
        condition: service_healthy

volumes:
  redis_data:
  searxng_cache:


